{% extends 'base.html' %} {% block content %}
<h2>Contact Form</h2>
<form method="post">
    <p>
        <label>Name: </label>
        <input type="text" name="name" required/>
    </p>
    <p>
        <button type="submit">Submit</button>
    </p>
</form>

{% if message %}
<p style="color: green">{{ message}}</p>
{% endif %} {% endblock %}
