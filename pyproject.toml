[project]
name = "python-bootcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Onur DOKER", email = "odoker@msn.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "playwright>=1.64.1",
    "requests>=2.34.2",
    "selenium>=4.51.0",
    "sqlalchemy>=2.1.6",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "webdriver-manager>=4.1.2",
]

[project.scripts]
python-bootcamp = "python_bootcamp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
